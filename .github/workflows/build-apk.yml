name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew clean assembleDebug --no-daemon
      - name: Verify APK and signing certificate
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk
          echo "=== APK SIGNING CERTIFICATE ==="
          keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk | tee apk-signing-certificate.txt
          echo "=== GRADLE SIGNING REPORT ==="
          ./gradlew signingReport --no-daemon | tee gradle-signing-report.txt
          {
            echo "RSS CLOUD SYNC"
            echo "Version: 1.8"
            echo "Package: com.riyaz.rsscloudsync"
            echo "Commit: $GITHUB_SHA"
            echo ""
            cat apk-signing-certificate.txt
          } > build-info.txt
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RSS-Cloud-Sync-v1.8-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build-info.txt
            gradle-signing-report.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish latest debug APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/RSS-Cloud-Sync-v1.8-debug.apk
          gh release delete latest-debug --yes || true
          gh release create latest-debug release-apk/RSS-Cloud-Sync-v1.8-debug.apk build-info.txt --title "RSS Cloud Sync v1.8 - Latest Debug APK" --notes "Automatically built from main commit $GITHUB_SHA" --prerelease
